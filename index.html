<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamCo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="boot">
    <p class="boot-kicker">Console simulation</p>
    <h1 id="service-name">StreamCo</h1>
    <p class="boot-copy">
      The day-by-day simulation is running in the browser console.
      Open developer tools to watch cash, subscribers, churn, and revenue update once per second.
    </p>
    <p class="boot-hint">
      Try <code>StreamCo.getState()</code> or <code>StreamCo.setMonthlyPrice(8)</code>.
    </p>
  </main>
  <script src="game.js"></script>
</body>
</html>
